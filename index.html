<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>恐竜図鑑</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="page">


<header class="fadein">

    <div class="logo">

        <img src="images/logo.png" alt="恐竜図鑑">

    </div>

</header>



<!--==============================
図鑑カード
==============================-->

<div class="info-card fadein">


    <!-- 背景カード -->

    <img 
    src="images/card.png" 
    class="card-bg" 
    alt="">



    <!-- カード上の内容 -->

    <div class="card-content">


        <!-- カルーセル -->

        <section class="slider">


            <div class="slides">


                <div class="slide">

                    <div class="placeholder">
                        Slide Image 1
                    </div>

                </div>



                <div class="slide">

                    <div class="placeholder">
                        Slide Image 2
                    </div>

                </div>


            </div>



            <div class="indicator">

                <span class="bar active"></span>

                <span class="bar"></span>

            </div>


        </section>





        <!-- 本文 -->

        <section class="contents">


            <h1>
                モササウルス<br>
                <span>Mosasaurs</span>
            </h1>



            <p>

                約9800万年前の白亜紀後期の海に生きていた
                獰猛な肉食動物です。<br><br>


                全長は3〜10mほどあると言われ、
                魚やアンモナイトなどを捕食していました。<br><br>


                時には首長竜やウミガメを襲うこともありました。


            </p>


        </section>


    </div>


</div>



</div>


<script src="script.js"></script>


</body>
</html>
