<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>恐竜図鑑</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <!--==============================
    ロゴ
    ==============================-->

    <header class="fadein">

        <div class="logo">

            <img src="images/logo.png" alt="恐竜図鑑">

        </div>

    </header>


    <!--==============================
    カルーセル
    ==============================-->

   <div class="info-card fadein">

    <section class="slider">

        <div class="slides">

            <div class="slide">
                <div class="placeholder">
                    Slide Image 1
                </div>
            </div>

            <div class="slide">
                <div class="placeholder">
                    Slide Image 2
                </div>
            </div>

        </div>

        <div class="indicator">
            <span class="bar active"></span>
            <span class="bar"></span>
        </div>

    </section>


    <section class="contents">

        <h1>
            モササウルス<br>
            <span>Mosasaurs</span>
        </h1>

        <p>

            約9800万年前の白亜紀後期の海に生きていた獰猛な肉食動物です。<br><br>

            全長は3〜10mほどあると言われ、
            魚やアンモナイトなどを捕食していました。<br><br>

            時には首長竜やウミガメを襲うこともありました。

        </p>

    </section>

</div>


</div>

<script src="script.js"></script>

</body>
</html>
