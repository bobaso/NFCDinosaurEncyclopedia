        <!-- 本文 -->

        <section class="contents">


            <h1>
                モササウルス<br>
                <span>Mosasaurs</span>
            </h1>



            <p>
 名前の由来：マーズ川のトカゲ<br>
生息年代：白亜紀後期<br>
 全長：約3〜15m<br>
                <br>
                約9800万年前、白亜紀後期の海に生きていた獰猛な肉食恐竜で
                当時の海では頂点捕食者であったとされています。<br>

                全長は小型のもので3m、大型のものは1０m以上あるものも発見されている。浅瀬で活動し
                魚や貝類、アンモナイトなどを捕食していました。<br>

                時には魚竜やウミガメを襲ったり、仲間同士で争うこともありました。


            </p>


        </section>
